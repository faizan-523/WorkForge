version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workforge_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://workforge_user:workforge_password@db:5432/workforge_db?schema=public
      - NEXTAUTH_SECRET=supersecretproductionkeyworkforge2026
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: workforge_db
    restart: always
    environment:
      POSTGRES_USER: workforge_user
      POSTGRES_PASSWORD: workforge_password
      POSTGRES_DB: workforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforge_user -d workforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
